<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../">
    <title>Show Details - Radiogids</title>
    <link rel="stylesheet" href="styles/styleguide.css">
    <link rel="stylesheet" href="styles/style.css">
    <!-- production versie -->
	<base href="/the-startup-responsive-interactive-website/">

    <script src="scripts/script.js" defer></script>
</head>
<body class="detail-body">

    <header class="header">
        <a onclick="history.back();" class="back-button">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Terug naar gids
        </a>
        <p id="detail-live-tag" class="live-indicator">STRAKS</p>
    </header>

    <main class="detail-container">
        <div class="detail-image-wrapper visually-hidden">
            <img id="detail-img" src="" alt="Show thumbnail" class="detail-hero-img">
        </div>



        <section class="detail-content">
            <h1 id="detail-name">Laden...</h1>
            
            <img src="/assets/transparent.webp" alt="">
            
            <div class="dj-section">
                <p class="label">Gepresenteerd door:</p>
                <p id="detail-djs" class="dj-names">Namen laden...</p>
            </div>

            <div class="description-section">
                <p class="label">Over dit programma:</p>
                <p id="detail-description" class="description-text">Beschrijving laden...</p>
            </div>
            
            <a href="#" id="detail-station-link" class="station-action-button">
                Luister nu naar de zender
            </a>
        </section>

        <a id="apple-calendar-btn" href="#" download="radio.ics" target="_blank">
            Zet in Apple Calendar v5
        </a>
    </main>

    <footer>
        <p>Radiogids Detailoverzicht</p>
    </footer>

</body>
</html>
